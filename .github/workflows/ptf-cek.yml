name: PTF Çek

on:
  schedule:
    # Her gün Türkiye saatiyle 14:10 (yarının PTF'si ~13:00-14:00'te açıklanır)
    - cron: '10 11 * * *'
  workflow_dispatch:       # Actions sekmesinden elle çalıştırma (ilk çalıştırmada 2019'dan itibaren geçmiş doldurulur)

permissions:
  contents: write

concurrency:
  group: ptf-cek
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri kur
        run: pip install requests

      # Kimlik bilgileri yalnız Secrets'tan gelir; betik bunları günlüğe yazmaz (Actions günlükleri herkese açık)
      - name: EPİAŞ'tan PTF çek
        env:
          EPIAS_USER: ${{ secrets.EPIAS_USER }}
          EPIAS_PASS: ${{ secrets.EPIAS_PASS }}
        run: python collector/ptf_cek.py
        timeout-minutes: 30

      - name: Sonucu kaydet
        run: |
          git config user.name "ges-bot"
          git config user.email "ges-bot@users.noreply.github.com"
          git add data/ptf.json
          git diff --staged --quiet || git commit -m "PTF verisi güncellendi"
          git pull --rebase origin main
          git push
