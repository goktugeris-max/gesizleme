name: GES Veri Çek

on:
  schedule:
    # Türkiye saatiyle 06:07 - 20:07 arası her saat (GitHub saatleri UTC'dir)
    - cron: '7 3-17 * * *'
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: veri-cek
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri kur
        run: pip install requests "fusion_solar_py[captcha]"

      - name: Huawei CAPTCHA modelini indir
        env:
          HUAWEI_USER: ${{ secrets.HUAWEI_USER }}
        run: |
          # Yalnızca Huawei tanımlıysa; model jgriss/FusionSolarPy (MIT) deposunun sabit bir sürümünden alınır
          if [ -n "$HUAWEI_USER" ]; then
            mkdir -p models
            curl -fsSL -o models/captcha_huawei.onnx \
              https://raw.githubusercontent.com/jgriss/FusionSolarPy/3e02b9f5d831673070e0f7ddac7d9db53ca2368b/models/captcha_huawei.onnx
          fi

      - name: Huawei ağ tanılaması (geçici)
        continue-on-error: true
        run: python collector/huawei_ag_tani.py

      - name: Portallardan veri çek
        run: python collector/collect.py
        env:
          GOODWE_USER: ${{ secrets.GOODWE_USER }}
          GOODWE_PASS: ${{ secrets.GOODWE_PASS }}
          HUAWEI_USER: ${{ secrets.HUAWEI_USER }}
          HUAWEI_PASS: ${{ secrets.HUAWEI_PASS }}
          HUAWEI_SUBDOMAIN: ${{ vars.HUAWEI_SUBDOMAIN }}

      - name: Sonucu kaydet
        run: |
          git config user.name "ges-bot"
          git config user.email "ges-bot@users.noreply.github.com"
          git add data/durum.json
          git diff --staged --quiet || git commit -m "Veri güncellendi"
          git push
