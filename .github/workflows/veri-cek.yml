name: GES Veri Çek

on:
  schedule:
    # Türkiye saatiyle 06:07 - 20:07 arası her saat (GitHub saatleri UTC'dir)
    - cron: '7 3-17 * * *'
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: veri-cek
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri kur
        run: pip install requests

      - name: Huawei logger bağlantı testi (geçici, yalnızca bu dalda)
        continue-on-error: true
        run: python collector/logger_baglanti_testi.py
        env:
          HUAWEI_LOGGER_IPS: ${{ secrets.HUAWEI_LOGGER_IPS }}

      - name: SMA keşfi (geçici, yalnızca bu dalda)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python collector/sma_kesif.py
        env:
          SMA_USER: ${{ secrets.SMA_USER }}
          SMA_PASS: ${{ secrets.SMA_PASS }}

      - name: Portallardan veri çek
        run: python collector/collect.py
        env:
          GOODWE_USER: ${{ secrets.GOODWE_USER }}
          GOODWE_PASS: ${{ secrets.GOODWE_PASS }}
          HUAWEI_KIOSK_URLS: ${{ secrets.HUAWEI_KIOSK_URLS }}
          # Huawei web girişi şu an KAPALI: hesap intl.fusionsolar.huawei.com'da ve bu adres GitHub'ın
          # ağından çözülemiyor. Açmak için HUAWEI_USER/HUAWEI_PASS/HUAWEI_SUBDOMAIN satırlarını
          # ve "fusion_solar_py[captcha]" kurulumunu ekleyin (kendi barındırdığınız runner'da).

      - name: Sonucu kaydet
        run: |
          git config user.name "ges-bot"
          git config user.email "ges-bot@users.noreply.github.com"
          git add data/durum.json
          git diff --staged --quiet || git commit -m "Veri güncellendi"
          git push
