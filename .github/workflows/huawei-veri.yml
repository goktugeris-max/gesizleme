name: Huawei Veri Çek

on:
  # ZAMANLAYICI KAPALI: intl.fusionsolar.huawei.com GitHub sunucularindan cozulemiyor (ERR_NAME_NOT_RESOLVED, 24.10.2026).
  # Turkiye'den cikan self-hosted runner kurulunca asagidaki satirlari acin (06:00-20:00 TR saati arasi saatlik, cron UTC'dir):
  # schedule:
  #   - cron: '37 3-17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: huawei-veri
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Playwright kur
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: FusionSolar'dan veri cek
        env:
          FS_USER: ${{ secrets.FS_USER }}
          FS_PASS: ${{ secrets.FS_PASS }}
        run: node scripts/fusionsolar_fetch.mjs

      - name: Degisiklikleri kaydet
        if: always()
        run: |
          git config user.name "gesizleme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/huawei.json || true
          git add data/huawei-gunluk.csv || true
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Huawei verisi: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi
