name: SMA Keşif (geçici)

on:
  workflow_dispatch: {}   # Yalnızca elle çalıştırılır

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: SMA keşfi
        run: python collector/sma_kesif.py
        env:
          SMA_USER: ${{ secrets.SMA_USER }}
          SMA_PASS: ${{ secrets.SMA_PASS }}
