name: APK Üret

# Panel sitesini açan Android uygulaması (Capacitor kabuğu) üretir.
# Elle çalıştırılır: Actions -> APK Üret -> Run workflow. APK "Artifacts" bölümünden inilir.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PANEL_URL: https://goktugeris-max.github.io/gesizleme/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor projesini kur
        run: |
          mkdir -p /tmp/uygulama/www && cd /tmp/uygulama
          cat > www/index.html <<'H'
          <!doctype html><meta charset="utf-8"><title>Enerji Paneli</title>
          <p style="font-family:sans-serif;padding:2rem">Panel yükleniyor… İnternet bağlantısını kontrol edin.</p>
          H
          cat > capacitor.config.json <<C
          {
            "appId": "tr.bel.izmir.enerjipaneli",
            "appName": "Enerji Paneli",
            "webDir": "www",
            "server": { "url": "$PANEL_URL", "cleartext": false }
          }
          C
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap add android
          pip install pillow
      - name: APK derle
        run: |
          cp "$GITHUB_WORKSPACE/icon-512.png" /tmp/uygulama/
          cd /tmp/uygulama
          python3 "$GITHUB_WORKSPACE/scripts/apk_ikon.py" android/app/src/main/res
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: enerji-paneli-apk
          path: /tmp/uygulama/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
